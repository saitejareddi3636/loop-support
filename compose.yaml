services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: loopp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: loopp
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - loopp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loopp -d loopp"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  loopp_pgdata:
