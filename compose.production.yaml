name: loopp-support
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: loopp_admin
      POSTGRES_PASSWORD: ${LOOPP_DB_ADMIN_PASSWORD:?}
      POSTGRES_DB: loopp
      LOOPP_DB_PASSWORD: ${LOOPP_DB_PASSWORD:?}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/tls/server.crt", "-c", "ssl_key_file=/tls/server.key", "-c", "shared_buffers=128MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./runtime/postgres:/tls:ro
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/01-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loopp_admin -d loopp"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 768m
    cpus: 0.5
    pids_limit: 128
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      GEMINI_API_KEY: ${GEMINI_API_KEY:?}
      GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL:-gemini-3.5-flash-lite}
      GEMINI_LIVE_MODEL: ${GEMINI_LIVE_MODEL:-gemini-3.8-live}
      DATABASE_URL: ${DATABASE_URL:?}
      SESSION_RATE_LIMIT_SECRET: ${SESSION_RATE_LIMIT_SECRET:?}
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?}
    volumes:
      - ./runtime/postgres/ca.crt:/tls/ca.crt:ro
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs: [/tmp:size=64m]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 2g
    cpus: 1
    pids_limit: 256
    logging: *logging
  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      LOOPP_GATEWAY_SECRET: ${LOOPP_GATEWAY_SECRET:?}
    ports: ["8443:8443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${LOOPP_TLS_CERT_DIR:?}:/tls:ro
    depends_on: [api]
    read_only: true
    tmpfs: [/data:size=16m, /config:size=16m, /tmp:size=16m]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    logging: *logging
volumes:
  pgdata:
