name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  pages:
    name: Deploy Cloudflare Pages
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Deploy Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=loopp-support --branch=main --commit-dirty=true
          workingDirectory: frontend
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  oracle:
    name: Deploy Oracle API
    runs-on: ubuntu-latest
    needs: pages
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Package API release archive
        run: |
          SHORT="${GITHUB_SHA:0:7}"
          tar -czf "/tmp/loopp-${SHORT}-source.tar.gz" \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='node_modules' \
            --exclude='frontend/dist' \
            --exclude='frontend/node_modules' \
            --exclude='evaluation/results' \
            --exclude='runtime' \
            --exclude='backups' \
            backend deploy compose.production.yaml README.md
          echo "SHORT=$SHORT" >> "$GITHUB_ENV"
      - name: Deploy Oracle API (preserve data)
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_SSH_PORT: ${{ secrets.ORACLE_SSH_PORT }}
        run: |
          set -euo pipefail
          if [ -z "${ORACLE_HOST:-}" ] || [ -z "${ORACLE_USER:-}" ] || [ -z "${ORACLE_SSH_KEY:-}" ]; then
            echo "Oracle SSH secrets are not configured."
            exit 1
          fi
          umask 077
          KEY="$RUNNER_TEMP/oracle_deploy_key"
          printf '%s\n' "$ORACLE_SSH_KEY" > "$KEY"
          chmod 600 "$KEY"
          PORT="${ORACLE_SSH_PORT:-22}"
          SSH=(ssh -i "$KEY" -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes)
          SCP=(scp -i "$KEY" -P "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes)
          # Transfer only release artifacts; execution is confined to /opt/loopp-support.
          "${SCP[@]}" "/tmp/loopp-${SHORT}-source.tar.gz" \
            "${ORACLE_USER}@${ORACLE_HOST}:/tmp/loopp-${SHORT}-source.tar.gz"
          "${SCP[@]}" deploy/remote_release.py \
            "${ORACLE_USER}@${ORACLE_HOST}:/tmp/loopp-remote_release.py"
          "${SSH[@]}" "${ORACLE_USER}@${ORACLE_HOST}" \
            "test -d /opt/loopp-support && \
             sudo install -d -m 700 /opt/loopp-support/deploy && \
             sudo install -m 700 /tmp/loopp-remote_release.py /opt/loopp-support/deploy/remote_release.py && \
             cd /opt/loopp-support && \
             sudo env LOOPP_RELEASE_SHA='${GITHUB_SHA}' /usr/bin/python3 /opt/loopp-support/deploy/remote_release.py"

  smoke:
    name: Production smoke
    runs-on: ubuntu-latest
    needs: [pages, oracle]
    if: always() && needs.pages.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Smoke check live Pages gateway
        run: |
          chmod +x deploy/smoke_test.sh
          ./deploy/smoke_test.sh https://loopp-support.pages.dev
      - name: Summarize
        if: always()
        run: |
          {
            echo "## Production deploy"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Pages job: \`${{ needs.pages.result }}\`"
            echo "- Oracle job: \`${{ needs.oracle.result }}\`"
            echo "- Live URL: https://loopp-support.pages.dev"
          } >> "$GITHUB_STEP_SUMMARY"
