name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: loopp
          POSTGRES_PASSWORD: loopp
          POSTGRES_DB: loopp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loopp -d loopp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit and DB tests
        env:
          # Hardening tests create disposable databases from this admin URL.
          DATABASE_URL: postgresql://loopp:loopp@127.0.0.1:5432/loopp
          RUN_DB_TESTS: "1"
          APP_ENV: local
          RELEVANCE_VERIFIER: "on"
          GEMINI_API_KEY: test-not-used-for-unit-suite
        run: python -m unittest discover -s tests

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
